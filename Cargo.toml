[workspace]
resolver = "3"
members = ["crates/hidlab-transport", "crates/hidlab-hidpp", "crates/hidlab-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
hidlab-transport = { path = "crates/hidlab-transport" }
hidlab-hidpp = { path = "crates/hidlab-hidpp" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
